# ─────────────────────────────────────────────────────────────────────────────
# database_update.yml  ·  DDL 变更管理主流水线
#
# 职责：手动触发，对指定 feature 的 DDL 变更文件进行多环境顺序部署。
#
# 触发方式：GitHub Actions → Run workflow，填写以下参数：
#   - environment : 目标环境（dev / qa / preprod / prod / all）
#   - feature     : feature 名称（如 user-feature）或 all（部署全部）
#   - force       : 是否强制重新执行（忽略 Hash 幂等检查）
#
# 执行顺序：dev → qa → preprod → prod（严格顺序，前一环境失败则中止）
# Prod 环境需通过 GitHub Environments 人工审批。
#
# 依赖：
#   - scripts/check_sql_executed.py  （DDL 执行脚本）
#   - .github/workflows/_deploy_ddl_env.yml  （单环境可复用工作流）
# ─────────────────────────────────────────────────────────────────────────────
name: "Database DDL Update"

permissions:
  contents: read

on:
  # ⚠️  临时过渡触发器：仅用于 dev 分支测试阶段，当 workflow 文件本身被推送时自动触发。
  # TODO: 等 database_update.yml 合并到 main 分支后，删除以下 push 块，仅保留 workflow_dispatch。
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/database_update.yml"  # 推送本文件即可触发一次测试运行

  workflow_dispatch:
    inputs:
      environment:
        description: "目标环境（选择 all 则按 dev→qa→preprod→prod 顺序全部部署）"
        required: true
        type: choice
        options:
          - all
          - dev
          - qa
          - preprod
          - prod
        default: dev

      feature:
        description: |
          要部署的 Feature 名称（输入 all 部署全部 feature）
          可用 feature 列表将在运行时自动检测并显示
          示例：user-feature  或  all
        required: true
        type: string
        default: "all"

      force:
        description: "强制重新执行所有 SQL（即使已执行过，忽略 Hash 幂等检查）"
        required: false
        type: boolean
        default: false

jobs:
  # ── 准备：动态发现 feature 列表 ───────────────────────────────────────────
  # 因 GitHub Actions 不支持在 workflow_dispatch 中动态生成下拉选项，
  # 在此 Job 中通过扫描 features/ 目录実现运行时动态发现与校验。
  prepare:
    name: "🔍 Resolve feature list"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      feature_list: ${{ steps.resolve.outputs.feature_list }}

    steps:
      - name: "⬇️  Checkout repository"
        uses: actions/checkout@v4

      - name: "🔍 Resolve and validate feature list"
        id: resolve
        shell: bash
        run: |
          # 动态扫描 features/ 目录（排除 shared 等保留目录）
          AVAILABLE=$(find features -mindepth 1 -maxdepth 1 -type d \
            ! -name 'shared' \
            -exec basename {} \; | sort)

          if [ -z "$AVAILABLE" ]; then
            echo "❌ features/ 目录下未找到任何 feature 目录"
            exit 1
          fi

          echo "📁 可用的 feature 列表:"
          echo "$AVAILABLE" | while read -r f; do echo "   - $f"; done

          INPUT="${{ inputs.feature }}"

          if [ "$INPUT" = "all" ]; then
            # 展开为全部 feature（换行符分隔）
            FEATURE_LIST="$AVAILABLE"
            echo "✅ 选择: all → 将部署 $(echo "$AVAILABLE" | wc -l | xargs) 个 feature"
          else
            # 校验用户输入是否为合法的 feature 名称
            if [ ! -d "features/$INPUT" ] || [ "$INPUT" = "shared" ]; then
              echo "❌ 无效的 feature 名称: '$INPUT'"
              echo "   可用 feature: $(echo "$AVAILABLE" | tr '\n' ', ' | sed 's/,$//')"
              exit 1
            fi
            FEATURE_LIST="$INPUT"
            echo "✅ 选择: $INPUT"
          fi

          # 输出给后续 Job 使用（将换行替换为 %0A 以支持 multiline output）
          echo "feature_list<<EOF" >> $GITHUB_OUTPUT
          echo "$FEATURE_LIST"    >> $GITHUB_OUTPUT
          echo "EOF"              >> $GITHUB_OUTPUT

  # ── 部署：dev 环境 ────────────────────────────────────────────────────────
  deploy-dev:
    name: "🚀 Deploy → dev"
    needs: prepare
    # 选择 all 或 dev 时执行；push 触发时 inputs.environment 为空，默认也只部署 dev
    if: |
      needs.prepare.result == 'success' &&
      (inputs.environment == 'all' || inputs.environment == 'dev' || inputs.environment == '')
    uses: ./.github/workflows/_deploy_ddl_env.yml
    with:
      env_name: dev
      feature_list: ${{ needs.prepare.outputs.feature_list }}
      force: ${{ inputs.force == true }}

  # ── 部署：qa 环境 ─────────────────────────────────────────────────────────
  deploy-qa:
    name: "🚀 Deploy → qa"
    needs: [prepare, deploy-dev]
    # 选择 all → 等待 dev 成功；选择 qa → dev 被跳过(skipped)，直接运行
    if: |
      needs.prepare.result == 'success' &&
      (inputs.environment == 'all' || inputs.environment == 'qa') &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    uses: ./.github/workflows/_deploy_ddl_env.yml
    with:
      env_name: qa
      feature_list: ${{ needs.prepare.outputs.feature_list }}
      force: ${{ inputs.force == true }}

  # ── 部署：preprod 环境 ────────────────────────────────────────────────────
  deploy-preprod:
    name: "🚀 Deploy → preprod"
    needs: [prepare, deploy-dev, deploy-qa]
    if: |
      needs.prepare.result == 'success' &&
      (inputs.environment == 'all' || inputs.environment == 'preprod') &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') &&
      (needs.deploy-qa.result == 'success' || needs.deploy-qa.result == 'skipped')
    uses: ./.github/workflows/_deploy_ddl_env.yml
    with:
      env_name: preprod
      feature_list: ${{ needs.prepare.outputs.feature_list }}
      force: ${{ inputs.force == true }}

  # ── 部署：prod 环境（人工审批门控）──────────────────────────────────────
  deploy-prod:
    name: "🔒 Deploy → prod"
    needs: [prepare, deploy-dev, deploy-qa, deploy-preprod]
    # prod 环境通过 GitHub Environments 配置 required reviewers 实现人工审批
    if: |
      needs.prepare.result == 'success' &&
      (inputs.environment == 'all' || inputs.environment == 'prod') &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') &&
      (needs.deploy-qa.result == 'success' || needs.deploy-qa.result == 'skipped') &&
      (needs.deploy-preprod.result == 'success' || needs.deploy-preprod.result == 'skipped')
    uses: ./.github/workflows/_deploy_ddl_env.yml
    with:
      env_name: prod
      feature_list: ${{ needs.prepare.outputs.feature_list }}
      force: ${{ inputs.force == true }}
